name: Docker Pack and Push

on:
  workflow_call: 
    inputs:
      dockerhub_username:
        required: true
        type: string
      dockerhub_repository:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      path_to_dockerfile:
        required: true
        type: string
      build_context:
        required: true
        type: string
    secrets: 
      dockerhub_access_token:
        description: "Docker Hub access token required to push the image"
        required: true

permissions:
  contents: read

jobs:
  docker-pack-and-push:
    name: Docker-Pack-And-Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ secrets.dockerhub_access_token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: ${{ inputs.path_to_dockerfile }}
          context: ${{ inputs.build_context }}
          push: true
          tags: ${{ inputs.dockerhub_username }}/${{ inputs.dockerhub_repository }}:${{ inputs.image_tag }}